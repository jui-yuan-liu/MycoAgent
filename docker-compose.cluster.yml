# C1：兩份無狀態 Manager + 共用 Postgres，由 nginx 對外只開一個 8080。
# 不要與預設 docker-compose.yml 同時 up（埠會撞）。
# 用法：docker compose -f docker-compose.cluster.yml up --build
name: mycoagent-cluster

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mycoagent
      POSTGRES_PASSWORD: mycoagent
      POSTGRES_DB: mycoagent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycoagent -d mycoagent"]
      interval: 2s
      timeout: 3s
      retries: 20

  manager-1:
    image: mycoagent:mvp
    build: .
    command:
      - python
      - -m
      - mycoagent
      - manager
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --bootstrap-group
      - default
      - --db
      - postgresql://mycoagent:mycoagent@postgres:5432/mycoagent
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 2s
      timeout: 2s
      retries: 20

  manager-2:
    image: mycoagent:mvp
    pull_policy: never
    command:
      - python
      - -m
      - mycoagent
      - manager
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --bootstrap-group
      - default
      - --db
      - postgresql://mycoagent:mycoagent@postgres:5432/mycoagent
    depends_on:
      postgres:
        condition: service_healthy
      manager-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 2s
      timeout: 2s
      retries: 20

  manager-lb:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/nginx-manager.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      manager-1:
        condition: service_healthy
      manager-2:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9090:9000"
      - "9091:9001"

  node-a:
    image: mycoagent:mvp
    pull_policy: never
    environment:
      MYCOAGENT_MANAGER: http://manager-lb:8080
      MYCOAGENT_S3_ENDPOINT: http://minio:9000
      MYCOAGENT_S3_ACCESS_KEY: minioadmin
      MYCOAGENT_S3_SECRET_KEY: minioadmin
      MYCOAGENT_S3_BUCKET: mycoagent
    command:
      - python
      - -m
      - mycoagent
      - node
      - --manager
      - http://manager-lb:8080
      - --group
      - default
      - --name
      - alpha
      - --host
      - 0.0.0.0
      - --port
      - "9001"
      - --advertise
      - http://node-a:9001
      - --skills
      - coding
      - --tools
      - shell
      - --executor
      - echo
    ports:
      - "9001:9001"
    depends_on:
      manager-lb:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9001/health')"]
      interval: 2s
      timeout: 2s
      retries: 20

  node-b:
    image: mycoagent:mvp
    pull_policy: never
    environment:
      MYCOAGENT_MANAGER: http://manager-lb:8080
      MYCOAGENT_S3_ENDPOINT: http://minio:9000
      MYCOAGENT_S3_ACCESS_KEY: minioadmin
      MYCOAGENT_S3_SECRET_KEY: minioadmin
      MYCOAGENT_S3_BUCKET: mycoagent
    command:
      - python
      - -m
      - mycoagent
      - node
      - --manager
      - http://manager-lb:8080
      - --group
      - default
      - --name
      - beta
      - --host
      - 0.0.0.0
      - --port
      - "9002"
      - --advertise
      - http://node-b:9002
      - --skills
      - coding
      - --tools
      - shell
      - --executor
      - echo
    ports:
      - "9002:9002"
    depends_on:
      manager-lb:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9002/health')"]
      interval: 2s
      timeout: 2s
      retries: 20
