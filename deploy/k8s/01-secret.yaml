# Example credentials — change before any non-local use.
# Leave MYCOAGENT_TOKEN empty for open local MVP; set the same value on Manager,
# Hosts, and ctl to enable shared Bearer auth.
apiVersion: v1
kind: Secret
metadata:
  name: mycoagent
  namespace: mycoagent
type: Opaque
stringData:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin
  MYCOAGENT_S3_ACCESS_KEY: minioadmin
  MYCOAGENT_S3_SECRET_KEY: minioadmin
  MYCOAGENT_TOKEN: ""
